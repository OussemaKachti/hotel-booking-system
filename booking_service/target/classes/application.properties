# Application Configuration
spring.application.name=BOOKING
server.port=8081

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:bookingdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (pour le développement)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator Configuration (Monitoring & Metrics)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

# Logging
logging.level.com.hotel.booking=DEBUG
logging.level.org.springframework.web=INFO

# Eureka Configuration
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Kafka Configuration - Production Ready
spring.kafka.bootstrap-servers=localhost:29092

# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.compression-type=snappy
spring.kafka.producer.max-in-flight-requests-per-connection=5
spring.kafka.producer.enable-idempotence=true
spring.kafka.producer.request-timeout-ms=30000
spring.kafka.producer.delivery-timeout-ms=120000

# Topic Configuration
kafka.topics.booking-created=booking.created
kafka.topics.booking-cancelled=booking.cancelled
kafka.topics.booking-completed=booking.completed
kafka.topics.booking-dlq=booking.dlq

# Retry Configuration
kafka.retry.max-attempts=3
kafka.retry.backoff-ms=1000
