version: '3.8'

services:
  # Eureka Server
  eureka:
    build: ./eureka-server
    ports:
      - "8761:8761"
    networks:
      - hotel-network

  # API Gateway
  gateway:
    build: ./api-gateway
    ports:
      - "8888:8888"
    depends_on:
      - eureka
    networks:
      - hotel-network

  # Keycloak (Authentification)
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    command: start-dev
    networks:
      - hotel-network

  # Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - hotel-network

  kafka:
    image: confluentinc/cp-kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
    depends_on:
      - zookeeper
    networks:
      - hotel-network

networks:
  hotel-network:
    driver: bridge